<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Maisie · Study room</title>
<style>
:root{--bg:#F6ECEA;--card:#FFF9F0;--ink:#2B1E24;--mu:#7A6268;--line:#EBD3CF;--acc:#C94F6D;--deep:#5A2333;--gold:#A57C1B;--blue:#2F6FA6;--ok:#2F7D55;--okbg:#E3F1E8;--warnbg:#FBEBCB;--bad:#A2342A;--badbg:#F8DAD5;--chip:#fff;--shadow:0 6px 22px rgba(90,35,51,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131A;--card:#221C25;--ink:#F3E7EA;--mu:#B9A3AA;--line:#3E3038;--acc:#E77D98;--deep:#F0B6C5;--gold:#E2B95A;--blue:#7FB2E0;--ok:#7FD0A0;--okbg:#1E3328;--warnbg:#3A3020;--bad:#F08C80;--badbg:#3D2321;--chip:#2A222D;--shadow:0 6px 22px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
button,input{font:inherit;color:inherit}
a{color:var(--acc)}
/* ---------- lock screen ---------- */
#lock{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
#lock[hidden]{display:none}
.lk{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:34px 26px 26px;text-align:center}
.lk .ic{font-size:44px;line-height:1}
.lk h1{font-size:22px;margin:12px 0 4px;letter-spacing:.02em;color:var(--deep)}
.lk p{margin:0 0 20px;color:var(--mu);font-size:15px}
.pw{display:flex;gap:8px}
.pw input{flex:1;min-width:0;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--chip)}
.pw input:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:transparent}
.eye{border:1.5px solid var(--line);background:var(--chip);border-radius:12px;padding:0 12px;cursor:pointer}
.go{margin-top:12px;width:100%;border:0;border-radius:12px;background:var(--deep);color:var(--card);font-weight:600;padding:12px;cursor:pointer;font-size:16px}
.go:disabled{opacity:.6;cursor:wait}
.rem{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;font-size:14px;color:var(--mu);text-align:left}
.rem input{flex:0 0 auto}
.rem input{width:18px;height:18px;accent-color:var(--acc)}
.err{min-height:22px;margin:10px 0 0;color:var(--bad);font-size:14px}
.lk.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* ---------- app ---------- */
#app[hidden]{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:880px;margin:0 auto;padding:14px 16px 6px;padding-top:max(14px,env(safe-area-inset-top))}
.brand{display:flex;gap:10px;align-items:center;min-width:0;flex:1 1 auto}
.brand>div{min-width:0}
.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .flower{font-size:26px}
.brand b{display:block;font-size:18px;color:var(--deep);line-height:1.2}
.brand small{display:block;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topr{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.cd{font:700 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--deep);color:var(--card);border-radius:999px;padding:5px 11px;white-space:nowrap}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 16px;max-width:880px;margin:0 auto;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:15px;white-space:nowrap;min-height:40px}
.tabs button[aria-selected="true"]{background:var(--deep);color:var(--card);border-color:var(--deep)}
main{max-width:880px;margin:0 auto;padding:4px 16px 40px}
.tab{display:none}.tab.on{display:block;animation:fi .25s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;margin:14px 0}
h1,h2,h3{color:var(--deep);line-height:1.25}
h2{font-size:19px;margin:0 0 8px}
h3{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:18px 0 8px}
.hint{color:var(--mu);font-size:14.5px;margin:4px 0 12px}
.rowh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rowh h2{margin:0}
.pct{font:700 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mu)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btnrow.ctr{justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--deep);background:var(--deep);color:var(--card);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer;text-decoration:none;font-size:15px}
.btn.ghost,.ghost{background:transparent;color:var(--deep);border:1.5px solid var(--line)}
.btn.sm,.ghost.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
button.ghost{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
/* hero */
.hero{text-align:center;background:linear-gradient(180deg,var(--card),var(--card)),var(--card);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--acc) 33%,var(--gold) 33% 66%,var(--blue) 66%)}
.kick{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin:6px 0 0;font-weight:600}
.hero h1{font:700 clamp(34px,10vw,48px)/1.1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;margin:8px 0 4px}
.hero h1 span{display:block;font:600 17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);margin-top:4px}
.hero .sub{margin:0;color:var(--mu)}
.count{font:400 18px ui-monospace,"SF Mono",Menlo,Consolas,monospace;margin:14px 0 4px}
.count b{font-size:30px;color:var(--deep)}
.hero .btnrow{justify-content:center}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0 0;text-align:left}
.facts div{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.facts dt{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.facts dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:var(--chip);border-radius:8px;font-size:12.5px;padding:2px 8px;margin-left:4px;cursor:pointer;font-weight:500}
.fmt{margin:14px 0 0;text-align:left;font-size:15px}
.note{margin:12px 0 0;text-align:left;font-size:14px;background:var(--warnbg);border-radius:12px;padding:10px 12px}
/* today */
.today-card{border:2px solid var(--acc)}
.today-card .kick{text-align:left;margin:0}
.today-card h2{font-size:22px;margin:4px 0 2px}
.today-card .tasks{padding:0}
.nextup{margin:12px 0 0;font-size:14.5px;color:var(--mu)}
.mini-def{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
/* plan */
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:10px 0 14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--gold));transition:width .4s}
.cal{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.mon{width:min(320px,100%)}
.monh{text-align:center;font-weight:600;color:var(--deep);margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--mu)}
.dc{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:14px;border:1.5px solid transparent;background:none;padding:0;min-width:0}
.dc.past{opacity:.55}
.dc.pl{background:#F3D9DF;color:var(--deep);cursor:pointer;font-weight:600}
.dc.part{background:linear-gradient(135deg,#BFE3CC 50%,#F3D9DF 50%)}
.dc.full{background:#BFE3CC;color:#1F5137}
.dc.today{border-color:var(--deep)!important;opacity:1}
.dc.def{background:var(--acc)!important;color:#fff!important;opacity:1;box-shadow:0 0 0 3px rgba(201,79,109,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dc.pl{background:#4A2B36;color:#F7D7E0}:root:not([data-theme="light"]) .dc.full{background:#2C5A40;color:#DFF5E7}:root:not([data-theme="light"]) .dc.part{background:linear-gradient(135deg,#2C5A40 50%,#4A2B36 50%)}}
.legend{width:100%;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:13px;color:var(--mu)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.k{width:12px;height:12px;border-radius:4px;display:inline-block}
.k.today{border:2px solid var(--deep)}.k.pl{background:#F3D9DF}.k.full{background:#BFE3CC}.k.def{background:var(--acc)}
.day{padding:0;overflow:hidden}
.day summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:14px 18px}
.day summary::-webkit-details-marker{display:none}
.day .dd{font:700 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--acc);white-space:nowrap}
.day .dt{font-weight:600;color:var(--deep)}
.day .dn{font:700 12.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mu);white-space:nowrap}
.day .now{font-style:normal;font-size:11.5px;background:var(--acc);color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.day.istoday{border:2px solid var(--acc)}
.day.isdef{background:linear-gradient(180deg,#FBE4EA,var(--card))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .day.isdef{background:linear-gradient(180deg,#3A2430,var(--card))}}
.day.past:not([open]){opacity:.72}
.tasks{list-style:none;margin:0;padding:0 18px 16px}
.tasks li{border-top:1px dashed var(--line)}
.tasks label,.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.tasks input,.chk input,.th input{width:20px;height:20px;flex:0 0 auto;margin-top:2px;accent-color:var(--ok)}
.tasks input:checked+span,.chk input:checked+span{text-decoration:line-through;color:var(--mu)}
@media (max-width:520px){.day summary{grid-template-columns:1fr auto}.day .dd{grid-column:1/-1}}
/* talk */
.tl{list-style:none;margin:0;padding:0;counter-reset:t}
.tl li{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--line);margin-left:6px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--acc)}
.tl .tm{font:700 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--acc);display:block}
.tl b{color:var(--deep);font-size:17px}
.tl p{margin:4px 0 0}
.pp{padding:10px 0;border-top:1px dashed var(--line)}
.pp:first-child{border-top:0}
.pp b{color:var(--acc);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.pp p{margin:4px 0 0}
.chain{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
.lnk{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:500;font-size:14.5px;text-align:center}
.arr{color:var(--acc);font-weight:700}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
thead th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
tbody th{color:var(--acc);white-space:nowrap}
.prop{display:flex;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.prop:first-child{border-top:0}
.pn{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--deep);color:var(--card);display:grid;place-items:center;font-weight:700}
.prop b{display:block;color:var(--deep)}
.prop p{margin:4px 0 0;font-size:15px}
.vd{display:inline-block;font-size:13px;font-weight:600;border-radius:99px;padding:2px 10px;margin-top:4px}
.vd.ok{background:var(--okbg);color:var(--ok)}.vd.part{background:var(--warnbg);color:var(--gold)}
/* numbers */
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.sw input{width:20px;height:20px;accent-color:var(--acc)}
.nrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:2px 14px;padding:9px 0;border-top:1px dashed var(--line);align-items:start}
.nl{font-weight:500}
.nv{font:700 15px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--deep);text-align:left;background:none;border:0;padding:0;cursor:pointer;border-radius:6px;transition:filter .2s}
.nv.hid{color:transparent;background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px);text-shadow:none;user-select:none;min-height:22px}
.nn{grid-column:2;font-size:13.5px;color:var(--mu)}
@media (max-width:560px){.nrow{grid-template-columns:1fr}.nn{grid-column:1}}
.fx{padding:12px 0;border-top:1px dashed var(--line)}
.fx:first-child{border-top:0}
.fx b{color:var(--deep)}
.fx code{display:block;font:700 15px ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--bg);border-radius:10px;padding:8px 10px;margin:6px 0;overflow-wrap:anywhere;white-space:normal}
.fx p{margin:0;font-size:14.5px;color:var(--mu)}
/* chapters */
.chp{border-top:1px solid var(--line)}
.chp summary{cursor:pointer;padding:12px 0;font-weight:600;color:var(--deep);list-style:none;display:flex;justify-content:space-between;gap:10px}
.chp summary::-webkit-details-marker{display:none}
.chp summary::after{content:"▾";color:var(--acc)}
.chp[open] summary::after{content:"▴"}
.chp ul{margin:0 0 14px;padding-left:20px}
.chp li{margin:6px 0}
/* Q&A */
.qa{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;transition:box-shadow .3s}
.qa.r-good{border-left:6px solid var(--ok)}.qa.r-ok{border-left:6px solid var(--gold)}.qa.r-again{border-left:6px solid var(--bad)}
.qa.flashy{box-shadow:0 0 0 4px rgba(201,79,109,.35)}
.qh{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:99px;background:var(--bg);padding:2px 9px;color:var(--mu);font-weight:500}
.tag.who{color:var(--acc)}
.qq{font-weight:600;font-size:17px;margin:8px 0 10px;color:var(--ink)}
.ans{margin-top:10px}
.key{background:var(--okbg);border-radius:10px;padding:10px 12px;font-weight:600}
.rate{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:14px;color:var(--mu)}
.rate button{border:1.5px solid var(--line);background:var(--chip);border-radius:99px;padding:6px 12px;cursor:pointer;min-height:36px}
.rate button[data-r="again"][aria-pressed="true"]{background:var(--bad);color:#fff;border-color:var(--bad)}
.rate button[data-r="ok"][aria-pressed="true"]{background:var(--gold);color:#fff;border-color:var(--gold)}
.rate button[data-r="good"][aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
#qaAgain[aria-pressed="true"]{background:var(--bad);color:#fff;border-color:var(--bad)}
/* traps */
.trap{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.trap.done{opacity:.6}
.th{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.th b{color:var(--deep)}
.trap p{margin:10px 0 0;font-size:15px}
.lb{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--bad);font-weight:600}
.lb.ok{color:var(--ok)}
/* flashcards */
.flash{display:grid;place-items:center;width:100%;min-height:220px;border:2px solid var(--line);border-radius:18px;background:var(--bg);padding:24px 18px;cursor:pointer;text-align:center;position:relative;margin-top:6px}
.flash .fcf{font-size:20px;font-weight:600;color:var(--deep)}
.flash .fcb{display:none;font:700 17px ui-monospace,"SF Mono",Menlo,Consolas,monospace;white-space:pre-line;color:var(--ink)}
.flash.flip{background:var(--okbg);border-color:var(--ok)}
.flash.flip .fcf{display:none}.flash.flip .fcb{display:block}
.flash em{position:absolute;bottom:8px;right:12px;font-size:12px;color:var(--mu);font-style:normal}
/* quiz */
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--chip);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:46px}
.opt.right{background:var(--okbg);border-color:var(--ok);font-weight:600}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.qzex{margin:12px 0;font-size:15px}
.qzend{font-size:18px}
/* timer */
.clock{font:700 clamp(64px,22vw,120px)/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;text-align:center;color:var(--deep);margin:16px 0 4px;font-variant-numeric:tabular-nums}
.clock.good{color:var(--ok)}.clock.warn{color:var(--gold)}.clock.over{color:var(--bad)}
.tmmsg{text-align:center;color:var(--mu);min-height:24px;margin:0}
.foot{text-align:center;color:var(--mu);font-size:13px;padding:10px 16px 30px;padding-bottom:max(30px,env(safe-area-inset-bottom))}
@media (max-width:520px){.lk{padding:28px 18px 20px}.card{padding:16px;border-radius:16px}.facts{grid-template-columns:1fr}.lbt{display:none}#lockBtn{min-width:40px}.brand small{display:none}}
@media print{.tabs,.topr,.btnrow{display:none}.tab{display:block!important}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div id="lock">
 <form class="lk" id="lkForm" autocomplete="off">
  <div class="ic" aria-hidden="true">🔒</div>
  <h1>Study room</h1>
  <p>This page is private. Enter the password to open it.</p>
  <div class="pw"><input type="password" id="pw" aria-label="Password" placeholder="Password" autocomplete="current-password" spellcheck="false" autocapitalize="off" autocorrect="off" required><button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false">👁</button></div>
  <button type="submit" class="go" id="go">Unlock</button>
  <label class="rem"><input type="checkbox" id="rem"> Keep me unlocked on this device</label>
  <p class="err" id="err" role="alert"></p>
 </form>
</div>
<div id="app" hidden></div>

function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}

function open(key){return C.decrypt({name:'AES-GCM',iv:b64(V.iv)},key,b64(V.ct)).then(function(buf){
  var P=JSON.parse(new TextDecoder().decode(buf));
  app.innerHTML=P.html;lock.hidden=true;app.hidden=false;
  (new Function(P.js))();return true;});}
